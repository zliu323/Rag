[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-base"
version = "1.0.0"
description = "Interview-ready enterprise knowledge-base RAG service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.12,<1",
  "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "PyMuPDF>=1.24,<2",
  "numpy>=1.26,<3", "faiss-cpu>=1.8,<2", "sentence-transformers>=3.0,<6", "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1", "langfuse>=5,<6"
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<8", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

